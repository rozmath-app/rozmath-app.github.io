<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pobierz Rozmath</title>
<link rel="icon" href="mathura_logo.svg" type="image/svg+xml">
<script>
  // Link do bio na Instagramie i kodów QR: iPhone → App Store, Android → Google Play, komputer → strona główna.
  // Te same linki co w index.html (LINKS).
  var IOS = "https://apps.apple.com/pl/app/id6828502079";
  var IOS_APP = "itms-apps://apps.apple.com/pl/app/id6828502079";   // otwiera od razu aplikację App Store
  var ANDROID = "https://play.google.com/store/apps/details?id=com.kr.mathura";
  var isIOS = false;
  try {
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isAndroid) location.replace(ANDROID);
    else if (isIOS) location.href = IOS_APP;
    else location.replace("index.html");
  } catch (e) {
    location.replace("index.html");   // coś poszło nie tak – strona główna
  }
  // zapas po 1,5 s: na iPhonie zostajemy z dużym przyciskiem App Store (przeglądarki w Messengerze i Instagramie
  // często blokują automatyczne przejście, a stuknięcie w przycisk działa zawsze); gdzie indziej – strona główna
  setTimeout(function () {
    if (isIOS) document.documentElement.className = "ios";
    else location.replace("index.html");
  }, 1500);
</script>
<!-- wyłączony JavaScript: od razu strona główna -->
<noscript><meta http-equiv="refresh" content="0; url=index.html"></noscript>
<style>
  body { margin: 0; min-height: 100vh; background: #040053; color: #fff; text-align: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 48px 16px; box-sizing: border-box; }
  a { color: #e5b800; }
  .store { display: none; margin: 24px auto; }
  .ios .store { display: inline-block; }
  .ios .wait { display: none; }
  .store img { height: 64px; }
</style>
</head>
<body>
  <!-- widoczne tylko, gdy przekierowanie nie zadziała (np. wyłączony JavaScript) -->
  <p class="wait">Przekierowuję do sklepu…</p>
  <p class="store"><a href="https://apps.apple.com/pl/app/id6828502079"><img src="app-store-pl.svg" alt="Pobierz w App Store"></a></p>
  <p><a href="https://apps.apple.com/pl/app/id6828502079">App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.kr.mathura">Google Play</a> · <a href="index.html">Strona Rozmath</a></p>
</body>
</html>
